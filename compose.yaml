services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: kidstracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d kidstracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${KIDSTRACKER_API_IMAGE:-ghcr.io/rplevka/androidtracker-api:latest}
    build: .
    environment:
      DATABASE_URL: postgres://tracker:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kidstracker?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN to a random value of at least 32 characters}
      LISTEN_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend
      - proxy
      - egress
    depends_on:
      db:
        condition: service_healthy

  traefik:
    image: traefik:v3.5.3
    profiles: ["https"]
    command:
      - --api.dashboard=false
      - --log.level=INFO
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "${TRACKER_BIND_IP:-127.0.0.1}:8081:80"
      - "${TRACKER_BIND_IP:-127.0.0.1}:8443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro,z
      - ./traefik/certs:/certs:ro,z
    networks:
      - proxy
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  proxy:
    name: kidstracker-proxy
    internal: true
  edge: {}
  egress: {}
